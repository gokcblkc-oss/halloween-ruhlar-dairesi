name: Restore report delivery ghost

on:
  push:
    paths:
      - README.md

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore the report-delivery animation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path("index.html")
          source = page.read_text(encoding="utf-8")

          replacements = [
              (
                  "    @keyframes fly {",
                  """    .delivery {
                position: fixed;
                z-index: 4;
                top: 50%;
                left: 0;
                display: none;
                width: 100%;
                height: 120px;
                transform: translateY(-50%);
                pointer-events: none;
              }
              .delivery.show { display: block; }
              .courier {
                position: absolute;
                top: 0;
                left: 0;
                display: flex;
                align-items: center;
                gap: 8px;
                animation: courier-flight 1.8s ease-in-out both;
                filter: drop-shadow(0 0 10px #fff8);
              }
              .delivery-ghost { font-size: 72px; }
              .letter {
                display: grid;
                width: 42px;
                height: 56px;
                place-items: center;
                border: 3px solid var(--parchment-edge);
                border-radius: 3px;
                background: var(--parchment);
                color: var(--parchment-text);
                font: 25px Georgia, serif;
              }
              @keyframes courier-flight {
                from { transform: translateX(-180px); }
                to { transform: translateX(calc(100vw + 180px)); }
              }
          """ + "    @keyframes fly {",
              ),
              (
                  '  <div class="ghost" aria-hidden="true">👻</div>',
                  '''  <div class="ghost" aria-hidden="true">👻</div>
          <div class="delivery" id="delivery" aria-hidden="true">
            <div class="courier"><span class="delivery-ghost">👻</span><span class="letter">✉</span></div>
          </div>''',
              ),
              (
                  '    const again = document.querySelector("#again");',
                  '    const again = document.querySelector("#again");\n    const delivery = document.querySelector("#delivery");',
              ),
              (
                  '''      card.hidden = true;
                report.classList.add("show");
                again.classList.add("show");''',
                  '''      card.hidden = true;
                delivery.classList.add("show");

                const courier = delivery.querySelector(".courier");
                courier.addEventListener("animationend", () => {
                  delivery.classList.remove("show");
                  report.classList.add("show");
                  again.classList.add("show");
                }, { once: true });''',
              ),
              (
                  '''      form.reset();
                error.textContent = "";
                report.classList.remove("show");''',
                  '''      form.reset();
                error.textContent = "";
                delivery.classList.remove("show");
                report.classList.remove("show");''',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match, found {count}: {old[:70]!r}")
              source = source.replace(old, new, 1)

          page.write_text(source, encoding="utf-8")
          workflow = Path(".github/workflows/restore-ghost.yml")
          workflow.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/restore-ghost.yml
          git commit -m "Restore ghost report delivery animation"
          git push